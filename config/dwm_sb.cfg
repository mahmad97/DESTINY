//DWM-SB RAM, 32-bit words, 4 MB, in the bank/mat organization of the NVSim DWM fork's dwm_sb.cfg
//(32 subarrays of 1024x1024 bits). Without -Force*, the search picks layouts of 1-16-row
//subarrays at ~5% area efficiency for this cell. For 128-512 KB use ForceBank 1x1 and ForceMat 1x1.
-DesignTarget: RAM
-OptimizationTarget: ReadEDP
-EnablePruning: Yes
-ProcessNode: 32
-Capacity (KB): 4096
-WordWidth (bit): 32
-DeviceRoadmap: HP
-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No
-Routing: H-tree
-InternalSensing: true
-MemoryCellInputFile: config/dwm_sb.cell
-Temperature (K): 350
-BufferDesignOptimization: latency
-StackedDieCount: 1
-ForceBank (Total AxB, Active CxD): 1x2, 1x1
-ForceMat (Total AxB, Active CxD): 4x4, 1x1
